// ── OAuth ──────────────────────────────────────────────────────────────
function initOAuth(){
  USER=document.getElementById("user-name").value.trim();
  if(!USER){showErr("Please enter your name.");return;}
  localStorage.setItem("sl_user",USER);
  tokenClient=google.accounts.oauth2.initTokenClient({
    client_id:CLIENT_ID,
    scope:SCOPES,
    callback:onTokenReceived,
  });
  tokenClient.requestAccessToken({prompt:""});
}

function onTokenReceived(resp){
  if(resp.error){showErr("Auth error: "+resp.error);return;}
  accessToken=resp.access_token;
  localStorage.setItem("sl_token",accessToken);
  localStorage.setItem("sl_token_exp",Date.now()+((resp.expires_in-60)*1000));
  launchApp();
}

function ensureToken(){
  return new Promise((resolve,reject)=>{
    const exp=parseInt(localStorage.getItem("sl_token_exp")||"0");
    if(accessToken&&Date.now()<exp){resolve();return;}
    if(!tokenClient){
      tokenClient=google.accounts.oauth2.initTokenClient({
        client_id:CLIENT_ID,scope:SCOPES,
        callback:(resp)=>{
          if(resp.error){reject(resp.error);return;}
          accessToken=resp.access_token;
          localStorage.setItem("sl_token",accessToken);
          localStorage.setItem("sl_token_exp",Date.now()+((resp.expires_in-60)*1000));
          resolve();
        }
      });
    }
    tokenClient.requestAccessToken({prompt:""});
  });
}

function signOut(){
  google.accounts.oauth2.revoke(accessToken,()=>{});
  accessToken="";
  localStorage.removeItem("sl_token");
  localStorage.removeItem("sl_token_exp");
  localStorage.removeItem("sl_user");
  document.getElementById("app").style.display="none";
  document.getElementById("setup-screen").style.display="flex";
}

function launchApp(){
  document.getElementById("setup-screen").style.display="none";
  document.getElementById("app").style.display="block";
  document.getElementById("user-badge").textContent=USER;
  document.getElementById("f-date").value=todayStr();
  const sel=document.getElementById("f-cat");
  sel.innerHTML=CATS.map(c=>`<option value="${c.name}">${c.icon} ${c.name}</option>`).join("");
  fetchData();
}

// ── Sheets API ─────────────────────────────────────────────────────────
const BASE=()=>`https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values`;
const authHdr=()=>({Authorization:`Bearer ${accessToken}`,"Content-Type":"application/json"});

async function fetchData(){
  try{
    await ensureToken();
    const res=await fetch(`${BASE()}/Sheet1!A:G`,{headers:authHdr()});
    if(!res.ok)throw new Error((await res.json()).error?.message||"API error");
    const d=await res.json();
    const rows=(d.values||[]).slice(1);
    allData=rows.map((r,i)=>({
  rowIndex:i+2,date:r[0]||"",amount:parseFloat(r[1])||0,
  category:r[2]||"Other",note:r[3]||"",who:r[4]||"",id:r[5]||"",mode:r[6]||"UPI"
})).filter(r=>r.date);
    renderCurrentView();
  }catch(e){
    showToast("❌ "+e.message);
    document.getElementById("recent-list").innerHTML=`<div class="empty" style="color:var(--accent)">Error: ${e.message}</div>`;
  }
}

async function appendRow(vals){
  await ensureToken();
  const res=await fetch(`${BASE()}/Sheet1!A:G:append?valueInputOption=USER_ENTERED`,{
    method:"POST",headers:authHdr(),body:JSON.stringify({values:[vals]})
  });
  if(!res.ok)throw new Error((await res.json()).error?.message);
}

async function updateRow(rowIndex,vals){
  await ensureToken();
  const res=await fetch(`${BASE()}/Sheet1!A${rowIndex}:F${rowIndex}?valueInputOption=USER_ENTERED`,{
    method:"PUT",headers:authHdr(),body:JSON.stringify({values:[vals]})
  });
  if(!res.ok)throw new Error((await res.json()).error?.message);
}

async function deleteRow(rowIndex){
  await ensureToken();
  const res=await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}:batchUpdate`,{
    method:"POST",headers:authHdr(),
    body:JSON.stringify({requests:[{deleteDimension:{range:{sheetId:0,dimension:"ROWS",startIndex:rowIndex-1,endIndex:rowIndex}}}]})
  });
  if(!res.ok)throw new Error((await res.json()).error?.message);
}

  try{
    const mode=document.getElementById("f-mode").value;
    const vals=[dt,amt,cat,note,USER,Date.now().toString(),mode];
    if(editRowIndex){await updateRow(editRowIndex,vals);showToast("✓ Updated");}
    else{await appendRow(vals);showToast("✓ Added!");}
    resetForm();await fetchData();
  }catch(e){showToast("❌ "+e.message);}
  btn.textContent=editRowIndex?"Update":"Add";btn.disabled=false;
}

function resetForm(){
  document.getElementById("f-amount").value="";
  document.getElementById("f-note").value="";
  document.getElementById("f-date").value=todayStr();
  document.getElementById("f-cat").value=CATS[0].name;
  document.getElementById("f-mode").value="UPI";
  editRowIndex=null;
  document.getElementById("submit-btn").textContent="Add";
  document.getElementById("cancel-btn").style.display="none";
  document.getElementById("form-title").textContent="➕ New Expense";
}

function cancelEdit(){resetForm();}

function startEdit(rowIndex){
  const e=allData.find(r=>r.rowIndex===rowIndex);if(!e)return;
  document.getElementById("f-amount").value=e.amount;
  document.getElementById("f-date").value=e.date;
  document.getElementById("f-cat").value=e.category;
  document.getElementById("f-note").value=e.note;
  editRowIndex=rowIndex;
  document.getElementById("submit-btn").textContent="Update";
  document.getElementById("cancel-btn").style.display="";
  document.getElementById("form-title").textContent="✏️ Edit Entry";
  switchView("log");window.scrollTo({top:0,behavior:"smooth"});
}

async function deleteEntry(rowIndex){
  if(!confirm("Delete this entry?"))return;
  try{await deleteRow(rowIndex);showToast("✓ Deleted");await fetchData();}
  catch(e){showToast("❌ "+e.message);}
}

// ── Views ──────────────────────────────────────────────────────────────
let currentView="log";
function switchView(v){
  currentView=v;
  ["log","month","compare","payment"].forEach(x=>document.getElementById("view-"+x).style.display=x===v?"":"none");
document.querySelectorAll(".nav-btn").forEach((b,i)=>b.classList.toggle("active",["log","month","compare","payment"][i]===v));
  renderCurrentView();
}
function renderCurrentView(){
  if(currentView==="log")renderLog();
  else if(currentView==="month")renderMonth();
  else if(currentView==="compare")renderCompare();
  else if(currentView==="payment")renderPayment();
}

function renderLog(){
  const list=document.getElementById("recent-list");
  const recent=[...allData].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,40);
  if(!recent.length){list.innerHTML=`<div class="empty">No entries yet. Add your first expense above.</div>`;return;}
  list.innerHTML=recent.map(e=>{
    const c=catInfo(e.category);
    return `<div class="expense-row">
      <div class="cat-dot" style="background:${c.color}"></div>
      <div class="exp-main"><div class="exp-label">${e.note||e.category}</div><div class="exp-meta">${e.date} · ${e.category}</div></div>
      <div class="exp-who">${e.who}</div>
      <div class="exp-amount" style="color:${c.color}">${fmt(e.amount)}</div>
      <button class="icon-btn edit" onclick="startEdit(${e.rowIndex})">edit</button>
      <button class="icon-btn" onclick="deleteEntry(${e.rowIndex})">del</button>
    </div>`;
  }).join("");
}

function renderMonth(){
  const months=[...new Set(allData.map(e=>monthKey(e.date)))].sort().reverse();
  if(!selectedMonth||!months.includes(selectedMonth))selectedMonth=months[0]||monthKey(todayStr());
  document.getElementById("month-chips").innerHTML=months.slice(0,8).map(m=>
    `<div class="month-chip ${m===selectedMonth?"active":""}" onclick="selectMonth('${m}')">${monthLabel(m)}</div>`
  ).join("");
  const entries=allData.filter(e=>monthKey(e.date)===selectedMonth);
  const total = entries.reduce(
  (s, e) => s + Number(e.amount || 0),
  0
  );

// Calculate totals for all people in this month
  const personTotals = {};

  entries.forEach(e => {
  const who = (e.who || "Unknown").trim().toUpperCase();
  personTotals[who] =
    (personTotals[who] || 0) + Number(e.amount || 0);
  });

  // Build stat boxes dynamically
  const personStats = Object.entries(personTotals)
  .sort((a, b) => b[1] - a[1])
  .map(([name, amount]) => `
    <div class="stat-box">
      <div class="stat-val">${fmt(amount)}</div>
      <div class="stat-label">${name}</div>
    </div>
  `)
  .join("");

  document.getElementById("month-stats").innerHTML = `
  <div class="stat-box">
    <div class="stat-val">${fmt(total)}</div>
    <div class="stat-label">Total</div>
  </div>
  ${personStats}
`;
  const catMap={};
  entries.forEach(e=>{catMap[e.category]=(catMap[e.category]||0)+e.amount;});
  const catData=CATS.map(c=>({...c,total:catMap[c.name]||0})).filter(c=>c.total>0).sort((a,b)=>b.total-a.total);
  document.getElementById("cat-bars").innerHTML=catData.map(c=>`
    <div class="cat-bar-row">
      <div class="cat-bar-label">${c.icon} ${c.name}</div>
      <div class="cat-bar-track"><div class="cat-bar-fill" style="background:${c.color};width:${total>0?c.total/total*100:0}%"></div></div>
      <div class="cat-bar-amt">${fmt(c.total)}</div>
    </div>`).join("")||`<div class="empty">No data</div>`;
  if(pieInst){pieInst.destroy();pieInst=null;}
  if(catData.length){
    pieInst=new Chart(document.getElementById("pie-chart").getContext("2d"),{type:"doughnut",data:{
      labels:catData.map(c=>c.name),
      datasets:[{data:catData.map(c=>c.total),backgroundColor:catData.map(c=>c.color),borderWidth:2,borderColor:"#fff"}]
    },options:{plugins:{legend:{position:"bottom",labels:{font:{family:"DM Mono",size:11},color:"#9A9088",boxWidth:10}}},cutout:"60%"}});
  }
  document.getElementById("month-list").innerHTML=[...entries].sort((a,b)=>b.date.localeCompare(a.date)).map(e=>{
    const c=catInfo(e.category);
    return `<div class="expense-row">
      <div class="cat-dot" style="background:${c.color}"></div>
      <div class="exp-main"><div class="exp-label">${e.note||e.category}</div><div class="exp-meta">${e.date}</div></div>
      <div class="exp-who">${e.who}</div>
      <div class="exp-amount" style="color:${c.color}">${fmt(e.amount)}</div>
    </div>`;
  }).join("")||`<div class="empty">No transactions.</div>`;
}

function selectMonth(m){selectedMonth=m;renderMonth();}

function renderCompare(){
  const months=[...new Set(allData.map(e=>monthKey(e.date)))].sort().slice(-6);
  if(!months.length){
    document.getElementById("compare-table").innerHTML=`<div class="empty">Add expenses for at least 1 month to compare.</div>`;
    return;
  }
  const totals=months.map(m=>({m,total:allData.filter(e=>monthKey(e.date)===m).reduce((s,e)=>s+e.amount,0)}));
  if(barInst){barInst.destroy();barInst=null;}
  barInst=new Chart(document.getElementById("bar-chart").getContext("2d"),{type:"bar",data:{
    labels:totals.map(t=>monthLabel(t.m)),
    datasets:[{label:"Total",data:totals.map(t=>t.total),backgroundColor:"#C84B31",borderRadius:6}]
  },options:{plugins:{legend:{display:false}},scales:{
    x:{ticks:{font:{family:"DM Mono",size:11},color:"#9A9088"},grid:{display:false}},
    y:{ticks:{font:{family:"DM Mono",size:11},color:"#9A9088",callback:v=>`₹${v>=1000?(v/1000).toFixed(0)+"k":v}`},grid:{color:"#E8E3DB"}}
  }}});
  const usedCats=CATS.filter(c=>months.some(m=>allData.some(e=>monthKey(e.date)===m&&e.category===c.name)));
  let html=`<table style="width:100%;border-collapse:collapse;font-size:12px;font-family:'DM Mono',monospace">
    <thead><tr><th style="text-align:left;padding:6px 12px 6px 0;color:var(--muted)">Category</th>
    ${months.map(m=>`<th style="text-align:right;padding:6px 0 6px 8px;color:var(--muted)">${monthLabel(m)}</th>`).join("")}
    </tr></thead><tbody>`;
  usedCats.forEach(c=>{
    html+=`<tr><td style="padding:7px 12px 7px 0">${c.icon} ${c.name}</td>`;
    months.forEach(m=>{
      const v=allData.filter(e=>monthKey(e.date)===m&&e.category===c.name).reduce((s,e)=>s+e.amount,0);
      html+=`<td style="text-align:right;padding:7px 0 7px 8px;color:${v>0?c.color:"var(--muted)"}">${v>0?fmt(v):"—"}</td>`;
    });
    html+="</tr>";
  });
  html+=`<tr style="border-top:2px solid var(--border)"><td style="padding:9px 12px 7px 0;font-weight:700">TOTAL</td>`;
  months.forEach(m=>{
    const v=allData.filter(e=>monthKey(e.date)===m).reduce((s,e)=>s+e.amount,0);
    html+=`<td style="text-align:right;padding:9px 0 7px 8px;font-weight:700">${fmt(v)}</td>`;
  });
  html+="</tr></tbody></table>";
  document.getElementById("compare-table").innerHTML=html;
}

let selectedPaymentMonth="";
let paymentPieInst=null;

const PAYMENT_COLORS={
  "UPI":"#C84B31",
  "Cash":"#2D6A4F",
  "Credit Card":"#2563EB",
  "Debit Card":"#D4AC0D",
  "Net Banking":"#7B2D8B",
};

function renderPayment(){
  const months=[...new Set(allData.map(e=>monthKey(e.date)))].sort().reverse();
  if(!selectedPaymentMonth||!months.includes(selectedPaymentMonth))selectedPaymentMonth=months[0]||monthKey(todayStr());

  // Month chips
  document.getElementById("payment-month-chips").innerHTML=months.slice(0,8).map(m=>
    `<div class="month-chip ${m===selectedPaymentMonth?"active":""}" onclick="selectPaymentMonth('${m}')">${monthLabel(m)}</div>`
  ).join("");

  const entries=allData.filter(e=>monthKey(e.date)===selectedPaymentMonth);
  const total=entries.reduce((s,e)=>s+e.amount,0);

  // Group by payment mode
  const modeMap={};
  entries.forEach(e=>{
    const mode=e.mode||"UPI";
    modeMap[mode]=(modeMap[mode]||0)+e.amount;
  });
  const modeData=Object.entries(modeMap)
    .map(([name,total])=>({name,total,color:PAYMENT_COLORS[name]||"#9B9B9B"}))
    .sort((a,b)=>b.total-a.total);

  // Bars
  document.getElementById("payment-bars").innerHTML=modeData.length?modeData.map(m=>`
    <div class="cat-bar-row">
      <div class="cat-bar-label" style="width:140px">${m.name}</div>
      <div class="cat-bar-track"><div class="cat-bar-fill" style="background:${m.color};width:${total>0?m.total/total*100:0}%"></div></div>
      <div class="cat-bar-amt">${fmt(m.total)} <span style="color:var(--muted);font-size:10px">(${total>0?(m.total/total*100).toFixed(0):0}%)</span></div>
    </div>`).join(""):`<div class="empty">No data for this month.</div>`;

  // Pie chart
  if(paymentPieInst){paymentPieInst.destroy();paymentPieInst=null;}
  if(modeData.length){
    paymentPieInst=new Chart(document.getElementById("payment-pie-chart").getContext("2d"),{type:"doughnut",data:{
      labels:modeData.map(m=>m.name),
      datasets:[{data:modeData.map(m=>m.total),backgroundColor:modeData.map(m=>m.color),borderWidth:2,borderColor:"#fff"}]
    },options:{plugins:{legend:{position:"bottom",labels:{font:{family:"DM Mono",size:11},color:"#9A9088",boxWidth:10}}},cutout:"60%"}});
  }

  // Transactions grouped by mode
  document.getElementById("payment-list").innerHTML=modeData.length?modeData.map(m=>{
    const modeEntries=entries.filter(e=>(e.mode||"UPI")===m.name).sort((a,b)=>b.date.localeCompare(a.date));
    return `
      <div style="margin-bottom:18px">
        <div style="font-size:11px;font-weight:700;color:${m.color};letter-spacing:.08em;text-transform:uppercase;font-family:'DM Mono',monospace;margin-bottom:10px;padding-bottom:6px;border-bottom:2px solid ${m.color}22">
          ${m.name} — ${fmt(m.total)}
        </div>
        ${modeEntries.map(e=>{
          const c=catInfo(e.category);
          return `<div class="expense-row">
            <div class="cat-dot" style="background:${c.color}"></div>
            <div class="exp-main"><div class="exp-label">${e.note||e.category}</div><div class="exp-meta">${e.date} · ${e.category}</div></div>
            <div class="exp-who">${e.who}</div>
            <div class="exp-amount" style="color:${c.color}">${fmt(e.amount)}</div>
          </div>`;
        }).join("")}
      </div>`;
  }).join(""):`<div class="empty">No transactions this month.</div>`;
}

function selectPaymentMonth(m){selectedPaymentMonth=m;renderPayment();}

// ── Boot ───────────────────────────────────────────────────────────────
// ── Boot ───────────────────────────────────────────────────────────────
function bootApp(){
  const u=localStorage.getItem("sl_user");
  const tok=localStorage.getItem("sl_token");
  const exp=parseInt(localStorage.getItem("sl_token_exp")||"0");
  if(u){
    USER=u;
    if(tok&&Date.now()<exp){
      accessToken=tok;
      launchApp();
    }
    else{
      USER=u;
      document.getElementById("user-name").value=u;
      tokenClient=google.accounts.oauth2.initTokenClient({
        client_id:CLIENT_ID,
        scope:SCOPES,
        callback:(resp)=>{
          if(resp.error){document.getElementById("user-name").value=u;return;}
          accessToken=resp.access_token;
          localStorage.setItem("sl_token",accessToken);
          localStorage.setItem("sl_token_exp",Date.now()+((resp.expires_in-60)*1000));
          launchApp();
        }
      });
      tokenClient.requestAccessToken({prompt:""});
    }
  } else {
    document.getElementById("setup-screen").style.display="flex";
  }
}

(function init(){
  const savedPin=localStorage.getItem("sl_pin");
  if(savedPin===APP_PIN){
    document.getElementById("pin-screen").style.display="none";
    bootApp();
  }
})();
</script>
